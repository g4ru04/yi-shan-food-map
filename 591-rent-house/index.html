<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>591 租屋清單</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>
  // 密碼鎖(同美食地圖 ADD_PWD_HASH):只擋一般瀏覽,資料本身仍可經公開 API / data.json 讀到
  const PWD_HASH = 'c0d7c54022345b39c9be73e19b30ccb040ba03b1fefb2566a9f510a09aba4796';
  const UNLOCK_KEY = 'rent591_unlocked';
  window.__unlocked = (async () => {
    if (sessionStorage.getItem(UNLOCK_KEY) === PWD_HASH) return;
    const pwd = prompt('請輸入密碼：');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd ?? ''));
    const hash = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
    if (hash !== PWD_HASH) { location.replace('../'); throw new Error('locked'); }
    sessionStorage.setItem(UNLOCK_KEY, hash);
  })();
</script>
<!-- Supabase 連線設定(url / publishable key)與美食地圖共用;必須是同步 script,放在下方 inline script 之前 -->
<script src="../assets/js/config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; font: 14px/1.45 -apple-system, "PingFang TC", sans-serif; color: #222; background: #f6f6f4; }
  /* 不固定高度:篩選列換行變高時整頁可捲,列表至少保留 60vh,不會被擠到 0 */
  .shell { display: flex; flex-direction: column; min-height: calc(100vh - 80px); border: 1px solid #ddd; background: #fff; }
  header { padding: 10px 16px; border-bottom: 1px solid #ddd; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  .meta { color: #666; font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; align-items: center; }
  .filters label { white-space: nowrap; }
  .filters input[type=number] { width: 72px; }
  .filters input[type=search] { width: 180px; }
  .count { font-weight: 600; margin-left: auto; }
  main { flex: 1 0 60vh; min-height: 60vh; display: grid; grid-template-columns: 1fr 380px; }
  #left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #list { flex: 1; overflow: auto; }
  #pager { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 8px; border-top: 1px solid #ddd; background: #fafafa; }
  #pager button { padding: 3px 12px; }
  #map { height: 100%; border-left: 1px solid #ddd; }
  #msg { padding: 24px; color: #b71c1c; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; text-align: left; }
  th { position: sticky; top: 0; background: #fafafa; cursor: pointer; user-select: none; font-weight: 600; white-space: nowrap; z-index: 1; }
  th.sorted::after { content: attr(data-dir); color: #888; }
  td.title { min-width: 240px; }
  td.fac { min-width: 170px; }
  td.nowrap, .badge { white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:hover, tr.active { background: #fff8e1; }
  img.thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; display: block; background: #eee; }
  .title a { color: #1a4fa0; text-decoration: none; font-weight: 600; }
  .sub { color: #777; font-size: 12px; }
  .badge { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 11px; margin-right: 3px; border: 1px solid #ccc; color: #555; }
  .badge.new { border-color: #2e7d32; color: #2e7d32; }
  .badge.relisted { border-color: #6a1b9a; color: #6a1b9a; }
  .badge.gone { border-color: #b71c1c; color: #b71c1c; }
  .badge.active { border-color: #1a4fa0; color: #1a4fa0; }
  tr.gone td { opacity: .45; }
  tr.gone td:nth-child(2), tr.gone td.last-seen { opacity: 1; }
  td.last-seen.stale, td.last-seen.stale .sub { color: #c62828; font-weight: 600; }
  .yes { color: #2e7d32; } .no { color: #b71c1c; } .unk { color: #999; }
  /* 桌機:篩選永遠展開;手機專用元件隱藏 */
  #fbox > summary, .mtabs, .sortl { display: none; }
  #pager span { white-space: nowrap; }

  /* ---- 手機版:列表 / 地圖切換、篩選收合、列表改卡片 ---- */
  /* 手機:窄螢幕或觸控裝置(含橫向、要求桌面版網站)都用這套 */
  @media (max-width: 768px), (pointer: coarse) {
    body { padding: 0; }
    .shell { min-height: 0; border: 0; }
    header { position: sticky; top: 0; z-index: 1000; background: #fff; padding: 8px 12px; }
    h1 { font-size: 15px; margin: 0; }
    .meta { display: block; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 篩選展開時標頭會很高,改成跟著捲動,不要蓋住列表 */
    header:has(#fbox[open]) { position: static; }
    .mtabs { display: flex; margin: 8px 0 4px; }
    .mtabs button { flex: 1; padding: 7px; font-size: 15px; border: 1px solid #1a4fa0; background: #fff; color: #1a4fa0; }
    .mtabs button:first-child { border-radius: 6px 0 0 6px; } .mtabs button:last-child { border-radius: 0 6px 6px 0; }
    .mtabs button.on { background: #1a4fa0; color: #fff; }
    #fbox > summary { display: list-item; cursor: pointer; padding: 6px 0; font-weight: 600; color: #1a4fa0; }
    .filters { gap: 10px 14px; margin-top: 4px; padding-bottom: 6px; }
    .filters input, .filters select { font-size: 16px; }
    .filters input[type=number] { width: 84px; }
    .filters .q, .filters .sortl { display: flex; flex: 1 1 100%; gap: 6px; align-items: center; }
    .filters .q input, .filters .sortl select { flex: 1; width: auto; }
    .count { display: none; }
    main { display: block; min-height: 0; }
    #map { display: none; height: calc(100vh - 150px); border-left: 0; }
    body.v-map #map { display: block; }
    body.v-map #left { display: none; }
    #list { overflow: visible; }
    thead { display: none; }
    table, tbody { display: block; }
    #rows tr { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; padding: 12px; border-bottom: 1px solid #e5e5e5; }
    #rows td { border: 0; padding: 0; }
    #rows td.c-thumb { flex: 0 0 96px; order: 0; }
    /* 標題吃滿縮圖右側整行,標籤才會換到下一行 */
    #rows td.title { flex: 1 1 calc(100% - 110px); min-width: 0; order: 1; }
    #rows td.title a { word-break: break-word; }
    #rows td.chip { flex: 0 0 auto; background: #f1f3f5; border-radius: 4px; padding: 2px 7px; font-size: 13px; text-align: left; color: #333; }
    #rows td.chip::before { content: attr(data-l) ' '; color: #888; font-size: 11px; }
    #rows td.chip br { display: none; }
    #rows td.chip .sub, #rows td.chip div { display: inline; margin-left: 4px; }
    #rows td.wide { flex: 1 1 100%; font-size: 12px; }
    #rows td.c-contact { white-space: normal; font-size: 13px; }
    #rows td.c-contact br { display: none; }
    #rows td.c-contact a { display: inline-block; padding: 4px 0 4px 10px; font-size: 14px; }
    #rows td.c-first, #rows td.c-status.is-active { display: none; }
    #rows td.c-price { order: 2; font-weight: 600; } #rows td.c-area { order: 3; } #rows td.c-dist { order: 4; color: #1a4fa0; }
    #rows td.c-floor { order: 5; } #rows td.c-light { order: 6; } #rows td.c-bed { order: 7; } #rows td.c-status { order: 8; }
    #rows td.c-post { order: 9; } #rows td.c-last { order: 10; } #rows td.c-first { order: 11; }
    #rows td.c-fac { order: 12; } #rows td.c-contact { order: 13; }
    tr.gone td { opacity: .55; }
    #pager { position: sticky; bottom: 0; }
    #pager button { padding: 6px 16px; font-size: 15px; }
  }
</style>
</head>
<body>
<div class="shell">
<header>
  <h1>591 租屋清單 <span class="meta" id="meta">讀取中…</span></h1>
  <div class="mtabs"><button data-v="list" class="on">列表</button><button data-v="map">地圖</button></div>
  <details id="fbox" open>
  <summary id="fsum">篩選 / 排序</summary>
  <div class="filters">
    <label>租金 <input type="number" id="pmin" step="500"> – <input type="number" id="pmax" step="500"></label>
    <label><input type="checkbox" id="withFee"> 含管理費</label>
    <label>坪數 <input type="number" id="amin" step="1"> – <input type="number" id="amax" step="1"></label>
    <label>區 <select id="section"><option value="">全部</option></select></label>
    <label>類型 <select id="kind"><option value="">全部</option></select></label>
    <label>採光 <select id="lighting"><option value="">全部</option><option value="good">好</option><option value="good,fair">好+普通</option><option value="poor">差</option></select></label>
    <label><input type="checkbox" id="bed"> 雙人床</label>
    <label><input type="checkbox" id="elev"> 電梯</label>
    <label><input type="checkbox" id="washer"> 洗衣機</label>
    <label><input type="checkbox" id="owner"> 屋主直租</label>
    <label>狀態 <select id="status"><option value="">全部</option><option value="active,new">在架</option><option value="new">24h 內新上架</option><option value="gone">已消失</option></select></label>
    <label class="sortl">排序 <select id="sortSel">
      <option value="dist:1">距離 近→遠</option><option value="total:1">租金(+管)低→高</option><option value="total:-1">租金(+管)高→低</option>
      <option value="area_real:-1">坪數 大→小</option><option value="first_seen:-1">首次爬到 新→舊</option><option value="post_days:1">發佈 新→舊</option>
    </select></label>
    <label class="q"><input type="search" id="q" placeholder="關鍵字(標題/地址/設備/備註)"></label>
    <span class="count" id="count"></span>
  </div>
  </details>
</header>
<main>
  <div id="left">
    <div id="list">
      <table>
        <thead><tr>
          <th></th>
          <th data-k="title">房源</th>
          <th data-k="dist">距離</th>
          <th data-k="status_n">狀態</th>
          <th data-k="first_seen">首次爬到</th>
          <th data-k="last_seen">最後爬到</th>
          <th data-k="post_days">發佈</th>
          <th data-k="total">租金(+管)</th>
          <th data-k="area_real" title="依實際面積(建物面積,不含公設)排序;無資料或數值不合理時以可使用面積代替">坪</th>
          <th data-k="floor_n">樓層</th>
          <th data-k="lighting_n">採光</th>
          <th data-k="bed_n">雙人床</th>
          <th>設備</th>
          <th>聯絡</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="msg" hidden></div>
    </div>
    <div id="pager">
      <button id="prev">上一頁</button><span id="pageInfo"></span><button id="next">下一頁</button>
    </div>
  </div>
  <div id="map"></div>
</main>
</div>
<script>
// 資料來源:預設讀 Supabase(rent_listings / rent_snapshots,由 scripts/591-rent.mjs watch 每小時寫入)。
// 要改讀靜態檔,把下面兩行的註解對調即可(data.json 由 `node scripts/591-rent.mjs dump` 從 Supabase 產生;
// json 模式需用 http server 開,file:// 讀不到)。
const DATA_SOURCE = 'supabase';
// const DATA_SOURCE = 'json';

const PAGE_SIZE = 50;
const isMobile = () => matchMedia('(max-width: 768px), (pointer: coarse)').matches;
// 預設排序基準點(距離以直線距離計)
const ORIGIN = [24.1418, 120.6870];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LIGHT = { good: ['好', 3, 'yes'], fair: ['普通', 2, ''], poor: ['差', 1, 'no'], unknown: ['?', 0, 'unk'] };
const BED = { yes: ['是', 2, 'yes'], no: ['否', 0, 'no'], unknown: ['?', 1, 'unk'] };
const STATUS = { new: ['24h 內新上架', 0, 'new'], active: ['在架', 1, 'active'], gone: ['已消失', 2, 'gone'] };
const fmt = (t) => t ? new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const distKm = (lat, lng) => {
  const r = Math.PI / 180, [a, b] = ORIGIN;
  const h = Math.sin((lat - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(lat * r) * Math.sin((lng - b) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};

// PostgREST 單次最多回 1000 列,分頁讀完
async function supaAll(table, order) {
  const C = window.SUPABASE_CONFIG, rows = [];
  for (let off = 0; ; off += 1000) {
    const r = await fetch(`${C.url}/rest/v1/${table}?select=*&order=${order}&limit=1000&offset=${off}`,
      { headers: { apikey: C.key, authorization: `Bearer ${C.key}` } });
    if (!r.ok) throw new Error(`${table} HTTP ${r.status}`);
    const page = await r.json();
    rows.push(...page);
    if (page.length < 1000) return rows;
  }
}

async function loadData() {
  if (DATA_SOURCE === 'json') {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`data.json HTTP ${r.status}`);
    return r.json();
  }
  // 每小時一筆爬取紀錄,只拿最近幾筆顯示
  const C = window.SUPABASE_CONFIG;
  const snapRes = fetch(`${C.url}/rest/v1/rent_snapshots?select=*&order=scraped_at.desc&limit=5`, { headers: { apikey: C.key, authorization: `Bearer ${C.key}` } })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`rent_snapshots HTTP ${r.status}`))));
  const [rows, snaps] = await Promise.all([supaAll('rent_listings', 'id'), snapRes]);
  return { snapshots: snaps.reverse().map((s) => ({ at: s.scraped_at, count: s.count, total: s.total })), items: rows.map((r) => r.data) };
}

// 建物面積(不含公設)常被填成整棟/整層面積或亂填,只採信落在可使用面積 50%~100% 的值
const buildOk = (i) => i.area_build != null && i.area_build >= i.area_ping * 0.5 && i.area_build <= i.area_ping;

// 可使用面積 - (可使用 − 建物面積不含公設);沒有(或不合理的)建物面積寫 ?,相等寫 -0
function areaText(i) {
  const use = Number(i.area_ping).toFixed(1);
  if (!buildOk(i)) return `${use} - ?`;
  const d = Math.round((i.area_ping - i.area_build) * 10) / 10;
  return d === 0 ? `${use} -0` : d > 0 ? `${use} - ${d.toFixed(1)}` : `${use} + ${(-d).toFixed(1)}`;
}

// 同一支號碼常以不同格式重複出現(0967-013-725 / 0967-013725),依數字去重
const uniqPhones = (ps) => [...new Map(ps.map((p) => [p.replace(/\D/g, ''), p])).values()];

let D, map, markers, byId, bounds, fitted = false, sortKey = 'dist', sortDir = 1, page = 0, list = [];
const baseStyle = (i) => ({ radius: 6, weight: 1, color: i.status === 'gone' ? '#999' : '#1a4fa0', fillOpacity: 0.6 });

function init(data) {
  D = data;
  const last = D.snapshots.at(-1);
  $('meta').textContent = `最近爬取 ${last ? `${fmt(last.at)} · ${last.count} 筆` : '—'} · 累計 ${D.items.length} 間 · 資料來源 ${DATA_SOURCE}`;
  for (const k of ['section', 'kind'])
    for (const v of [...new Set(D.items.map((i) => i[k]))].sort()) $(k).insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`);
  for (const i of D.items) {
    i.total = i.price + (i.manage_fee || 0);
    i.lighting_n = LIGHT[i.lighting]?.[1] ?? 0;
    i.bed_n = BED[i.double_bed]?.[1] ?? 1;
    i.status_n = STATUS[i.status][1];
    i.area_real = buildOk(i) ? i.area_build : i.area_ping;
    i.dist = i.lat ? distKm(i.lat, i.lng) : null;
    i.search = [i.title, i.address, i.facilities.join(' '), i.tags.join(' '), i.vision_note, i.contact].join(' ').toLowerCase();
  }

  map = L.map('map').setView(ORIGIN, 14); // 先給預設視野,隱藏狀態下加 marker 才不會報錯
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri', maxZoom: 19 }).addTo(map);
  markers = new Map();
  byId = new Map(D.items.map((i) => [i.id, i]));
  for (const i of D.items) if (i.lat) {
    const m = L.circleMarker([i.lat, i.lng], baseStyle(i))
      .bindPopup(`<b><a href="${esc(i.url)}" target="_blank">${esc(i.title)}</a></b><br>${i.price} 元 · ${i.area_ping} 坪 · ${esc(i.floor)}/${esc(i.floor_total)}<br>${esc(i.address)}<br><a href="#" data-show="${i.id}">在列表中查看 ›</a>`);
    m.on('click', () => showRow(i.id));
    markers.set(i.id, m);
  }
  bounds = D.items.filter((i) => i.lat).map((i) => [i.lat, i.lng]);
  fitMap();
  L.marker(ORIGIN, { title: '基準點' }).addTo(map).bindPopup('距離基準點');

  $('rows').addEventListener('mouseover', (e) => { const tr = e.target.closest('tr'); if (tr) highlight(Number(tr.dataset.id)); });
  // 桌機點整列、手機點距離標籤:地圖定位到該房源(手機會切到地圖頁)
  $('rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr'); if (!tr || e.target.closest('a')) return;
    if (isMobile() && !e.target.closest('.c-dist')) return;
    const m = markers.get(Number(tr.dataset.id)); if (!m) return;
    if (isMobile()) setView('map');
    map.setView(m.getLatLng(), 16); m.openPopup();
  });
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-show]'); if (!a) return;
    e.preventDefault(); setView('list'); showRow(Number(a.dataset.show));
  });
  document.querySelectorAll('.mtabs button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.v)));
  $('sortSel').addEventListener('change', () => { [sortKey, sortDir] = $('sortSel').value.split(':'); sortDir = Number(sortDir); refresh(); });
  if (isMobile()) $('fbox').open = false;
  document.querySelectorAll('th[data-k]').forEach((th) => th.addEventListener('click', () => {
    sortDir = sortKey === th.dataset.k ? -sortDir : 1; sortKey = th.dataset.k; refresh();
  }));
  document.querySelectorAll('.filters input, .filters select:not(#sortSel)').forEach((el) => el.addEventListener('input', refresh));
  $('prev').onclick = () => { page--; renderPage(); };
  $('next').onclick = () => { page++; renderPage(); };
  refresh();
}

// 手機版地圖一開始是隱藏的(尺寸 0),fitBounds 會算錯;等第一次看得到地圖時再框
function fitMap() {
  if (fitted || !bounds.length || !$('map').offsetWidth) return;
  map.fitBounds(bounds, { padding: [20, 20] });
  fitted = true;
}

function setView(v) {
  document.body.classList.toggle('v-map', v === 'map');
  document.querySelectorAll('.mtabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'map') { map.invalidateSize(); fitMap(); }
}

function highlight(id) {
  document.querySelectorAll('tr.active').forEach((t) => t.classList.remove('active'));
  document.querySelector(`tr[data-id="${id}"]`)?.classList.add('active');
  for (const [k, m] of markers) m.setStyle(k === id ? { color: '#e65100', radius: 10, fillOpacity: 0.9 } : baseStyle(byId.get(k)));
}

// 點地圖上的房源:跳到它所在的那一頁再捲過去
function showRow(id) {
  const idx = list.findIndex((i) => i.id === id);
  if (idx < 0) return;
  if (Math.floor(idx / PAGE_SIZE) !== page) { page = Math.floor(idx / PAGE_SIZE); renderPage(); }
  document.querySelector(`tr[data-id="${id}"]`)?.scrollIntoView({ block: 'center' });
  highlight(id);
}

function filtered() {
  const n = (id) => ($(id).value === '' ? null : Number($(id).value));
  const [pmin, pmax, amin, amax] = ['pmin', 'pmax', 'amin', 'amax'].map(n);
  const lights = $('lighting').value ? $('lighting').value.split(',') : null;
  const q = $('q').value.trim().toLowerCase();
  const sts = $('status').value ? $('status').value.split(',') : null;
  return D.items.filter((i) => {
    const p = $('withFee').checked ? i.total : i.price;
    return (pmin == null || p >= pmin) && (pmax == null || p <= pmax)
      && (amin == null || i.area_ping >= amin) && (amax == null || i.area_ping <= amax)
      && (!$('section').value || i.section === $('section').value)
      && (!$('kind').value || i.kind === $('kind').value)
      && (!lights || lights.includes(i.lighting))
      && (!$('bed').checked || i.double_bed === 'yes')
      && (!$('elev').checked || i.has_elevator)
      && (!$('washer').checked || i.has_washer)
      && (!$('owner').checked || i.contact_role === '屋主')
      && (!sts || sts.includes(i.status))
      && (!q || q.split(/\s+/).every((w) => i.search.includes(w)));
  }).sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (x == null) - (y == null) || (x < y ? -1 : x > y ? 1 : 0) * sortDir;
  });
}

// 篩選 / 排序變動:重算清單、地圖點,回到第 1 頁
function refresh() {
  list = filtered();
  const ids = new Set(list.map((i) => i.id));
  for (const [id, m] of markers) ids.has(id) ? m.addTo(map) : m.remove();
  $('count').textContent = `${list.length} / ${D.items.length} 筆`;
  $('fsum').textContent = `篩選 / 排序 · ${list.length} / ${D.items.length} 筆`;
  const sv = `${sortKey}:${sortDir}`;
  if ([...$('sortSel').options].some((o) => o.value === sv)) $('sortSel').value = sv;
  document.querySelectorAll('th[data-k]').forEach((th) => {
    th.classList.toggle('sorted', th.dataset.k === sortKey);
    th.dataset.dir = sortDir > 0 ? ' ▲' : ' ▼';
  });
  page = 0;
  renderPage();
}

function renderPage() {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  page = Math.min(Math.max(page, 0), pages - 1);
  $('pageInfo').textContent = `第 ${page + 1} / ${pages} 頁`;
  $('prev').disabled = page === 0;
  $('next').disabled = page >= pages - 1;
  $('list').scrollTop = 0;
  $('rows').innerHTML = list.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE).map((i) => {
    const [lt, , lc] = LIGHT[i.lighting] || LIGHT.unknown;
    const [bt, , bc] = BED[i.double_bed] || BED.unknown;
    const [st, , sc] = STATUS[i.status];
    const badges = (i.old_ids.length ? `<span class="badge relisted" title="判定與舊 id ${i.old_ids.join(', ')} 為同一間">換 id 重刊</span>` : '')
      + (i.preferred ? '<span class="badge">優選</span>' : '')
      + (i.contact_role === '屋主' ? '<span class="badge">屋主</span>' : '');
    return `<tr data-id="${i.id}" class="${i.status === 'gone' ? 'gone' : ''}">
      <td class="c-thumb"><a href="${esc(i.url)}" target="_blank"><img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="${esc(i.photo)}"></a></td>
      <td class="title"><a href="${esc(i.url)}" target="_blank">${esc(i.title)}</a><div>${badges}</div>
        <div class="sub">${esc(i.kind)} · ${esc(i.address)} · #${i.id}</div></td>
      <td class="num chip c-dist" data-l="📍">${i.dist == null ? '?' : i.dist.toFixed(1) + ' km'}</td>
      <td class="nowrap chip c-status ${i.status === 'active' ? 'is-active' : ''}" data-l=""><span class="badge ${sc}">${st}</span>${i.status === 'gone' && i.gone_at ? `<div class="sub">${fmt(i.gone_at)} 起不見</div>` : ''}</td>
      <td class="sub nowrap chip c-first" data-l="首次">${fmt(i.first_seen)}</td>
      <td class="sub nowrap chip c-last last-seen ${i.status === 'gone' ? 'stale' : ''}" data-l="最後" title="${i.status === 'gone' ? '最新一次爬取沒有這間' : ''}">${fmt(i.last_seen)}<br><span class="sub">共 ${i.seen_count} 次</span></td>
      <td class="sub nowrap chip c-post" data-l="發佈">${esc(i.post_time)}<br><span class="sub">${esc(i.refresh_time || '')}</span></td>
      <td class="num chip c-price" data-l="$">${i.price.toLocaleString()}<div class="sub">${i.manage_fee ? '+' + i.manage_fee : esc(i.manage_fee_note || '')}</div>${i.price_history.length > 1 ? `<div class="sub" title="歷次租金">${i.price_history.join('→')}</div>` : ''}</td>
      <td class="num chip c-area" data-l="坪" title="可使用 ${i.area_ping} 坪 / 建物(不含公設)${i.area_build ?? '?'} 坪${i.area_build != null && !buildOk(i) ? '(數值不合理,未採用)' : ''} / 權狀 ${i.area_right ?? '?'} 坪">${areaText(i)}</td>
      <td class="num chip c-floor" data-l="樓">${esc(i.floor)}/${esc(i.floor_total)}</td>
      <td class="${lc} chip c-light" data-l="採光" title="${esc(i.vision_note)}">${lt}</td>
      <td class="${bc} chip c-bed" data-l="雙人床" title="${esc(i.vision_note)}">${bt}</td>
      <td class="sub fac wide c-fac">${i.has_elevator ? '<span class="yes">電梯</span>' : '<span class="no">無電梯</span>'} ·
        ${i.has_washer ? '<span class="yes">洗衣機</span>' : '<span class="no">無洗衣機</span>'}<br>${esc(i.facilities.filter((f) => f !== '電梯' && f !== '洗衣機').join('、'))}</td>
      <td class="sub nowrap wide c-contact">${esc(i.contact)}<br>${uniqPhones(i.phones).map((p) => `<a href="tel:${esc(p)}">${esc(p)}</a>`).join('<br>')}</td>
    </tr>`;
  }).join('');
}

window.__unlocked
  .then(loadData)
  .then((data) => {
    if (!data.items?.length) throw new Error('沒有資料');
    init(data);
  })
  .catch((e) => {
    if (e.message === 'locked') return;
    $('meta').textContent = '';
    $('msg').hidden = false;
    $('msg').textContent = `讀取失敗(${DATA_SOURCE}):${e.message}` +
      (DATA_SOURCE === 'json' && location.protocol === 'file:' ? '。json 模式要用 http server 開(repo 根目錄 make start)' : '');
  });
</script>
</body>
</html>
