<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿珊的美食地圖</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/img/favicon.svg" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 問候語（讀 cookie 顯示使用者名字，點一下可改名）-->
  <div id="greeting" class="greeting" title="點一下可改名字" hidden></div>

  <div class="app">
    <!-- 側邊欄 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-emoji">🍜</span>
        <span class="brand-title">阿珊的<br />美食地圖</span>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-view="map">🗺️ <span>地圖顯示</span></button>
        <button class="nav-btn" data-view="list">📋 <span>造訪列表</span></button>
        <button class="nav-btn" data-view="add">➕ <span>新增地點</span></button>
      </nav>
      <div class="sidebar-foot">
        <span id="count-badge">— 筆紀錄</span>
      </div>
    </aside>

    <!-- 主內容 -->
    <main class="content">
      <!-- 1) 地圖 -->
      <section id="view-map" class="view active">
        <label class="map-filter">
          <input type="checkbox" class="filter-toggle" /> 只顯示餐廳
        </label>
        <div id="map"></div>
        <button type="button" id="btn-locate" class="btn-locate" title="我的位置">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
          </svg>
        </button>
        <div id="pick-mode-bar" class="pick-mode-bar" hidden>
          <span>📍 點擊地圖選擇座標</span>
          <button type="button" id="pick-mode-cancel" class="btn small">取消</button>
        </div>
      </section>

      <!-- 2) 列表 -->
      <section id="view-list" class="view">
        <div class="view-head">
          <h2>造訪餐廳列表（依造訪時間新到舊）</h2>
          <label class="list-filter">
            <input type="checkbox" class="filter-toggle" /> 只顯示餐廳
          </label>
        </div>
        <div id="list-container" class="list-container"></div>
      </section>

      <!-- 3) 新增（⚡ 快速登錄 / ➕ 一般新增，兩區收合）-->
      <section id="view-add" class="view">
        <div class="view-head">
          <h2 id="form-title">新增一個地點</h2>
        </div>

        <div class="add-stack">
          <!-- A) 快速登錄：只記時間 + 短網址 + 備註，之後交給 LLM 補齊 -->
          <details id="sec-quick" class="section-card">
            <summary>
              <span class="sec-title">⚡ 快速登錄</span>
              <span class="sec-sub">時間 + Google 短網址，晚點再補齊</span>
            </summary>
            <div class="section-body">
            <p class="hint">在外面吃完就先記一筆：時間預設現在，貼上 Google 分享的短網址即可。之後用「複製全部」把清單交給 LLM 補齊資料、寫進地圖。</p>

            <form id="quick-form" class="quick-form">
              <label>時間
                <input type="datetime-local" name="visited_at" required />
              </label>
              <label>Google 短網址 *
                <input type="url" name="google_url" placeholder="https://maps.app.goo.gl/..." required />
              </label>
              <label>備註（選填）
                <input type="text" name="note" maxlength="200" placeholder="例：吃了牛肉麵，湯頭讚" />
              </label>
              <button type="submit" class="btn primary" id="quick-submit">⚡ 送出</button>
            </form>

            <div class="pending-head">
              <h4>待處理 <span id="pending-count">—</span> 筆</h4>
              <div class="pending-actions">
                <button type="button" class="btn small" id="pending-copy">📋 複製全部</button>
                <button type="button" class="btn small danger" id="pending-clear">🗑️ 清空全部</button>
              </div>
            </div>
            <div id="pending-list" class="pending-list"></div>
            </div>
          </details>

          <!-- B) 一般新增：完整欄位（編輯地點也是走這個表單）-->
          <details id="sec-full" class="section-card">
            <summary>
              <span class="sec-title">➕ 一般新增</span>
              <span class="sec-sub">完整欄位：店名、座標、評價、照片</span>
            </summary>
            <div class="section-body">
              <form id="place-form">
                <!-- 我的星等 / 評價 / 照片（編輯時置頂；新增時照原順序排在後面）-->
                <div id="priority-fields">
                  <label>文字評價（500 字內）
                    <textarea name="review" maxlength="500" rows="4" placeholder="寫下你的心得…"></textarea>
                    <span class="counter"><span id="review-count">0</span> / 500</span>
                  </label>

                  <!-- 編輯模式：我的星等(搬進 slot) 與 照片 同列；新增模式 slot 為空、照片佔整列 -->
                  <div class="row" id="rating-photo-row">
                    <div id="rating-slot"></div>
                    <label>照片（選填）
                      <input type="file" name="image" accept="image/*" />
                    </label>
                  </div>
                  <img id="image-preview" class="image-preview" hidden alt="預覽" />
                  <button type="button" id="btn-remove-image" class="btn small danger" hidden>🗑️ 移除照片</button>
                </div>

                <!-- 其他資料：新增時展開呈現一般表單；編輯時收合 -->
                <details id="more-fields" class="more-fields" open>
                  <summary>其他資料（店名,類型,...）</summary>

                  <label>店家名稱 *
                    <input type="text" name="name" maxlength="100" placeholder="例：阿珊牛肉麵" />
                  </label>

                  <label>造訪時間（選填）
                    <input type="datetime-local" name="visited_at" />
                  </label>

                  <label>類型（選填）
                    <input type="text" name="category" maxlength="40" placeholder="例：意大利餐廳、咖啡廳、景點" />
                  </label>

                  <label class="checkbox-label">
                    <input type="checkbox" name="is_restaurant" checked />
                    這是餐廳（取消勾選後可被「只顯示餐廳」篩選掉）
                  </label>

                  <label class="checkbox-label">
                    <input type="checkbox" name="is_closed" />
                    已永久歇業
                  </label>

                  <div class="row">
                    <label>緯度 lat *
                      <input type="number" name="lat" step="any" placeholder="25.0330" />
                    </label>
                    <label>經度 lon *
                      <input type="number" name="lon" step="any" placeholder="121.5654" />
                    </label>
                  </div>
                  <p class="hint">👉 不知道座標？點下方小地圖，或按「從大地圖選位置」。</p>
                  <button type="button" id="btn-pick-main" class="btn small">📍 從大地圖選位置</button>
                  <div id="pick-map"></div>

                  <div class="row" id="rating-row">
                    <label id="rating-field">乙珊評分（0~5）
                      <input type="number" name="rating" min="0" max="5" step="0.5" placeholder="4.5" />
                    </label>
                    <label>Google 星等（1~5）
                      <input type="number" name="google_rating" min="1" max="5" step="0.1" placeholder="4.2" />
                    </label>
                  </div>

                  <label>Google 連結 / place_id
                    <div class="url-input-row">
                      <input type="text" name="google_url" placeholder="貼 Google Maps 網址、place_id，或留空用座標" />
                      <button type="button" id="btn-parse-url" class="btn small">自動填入</button>
                    </div>
                    <span class="hint" id="url-parse-hint" hidden></span>
                  </label>
                </details>

                <div class="form-actions">
                  <button type="submit" class="btn primary" id="submit-btn">儲存地點</button>
                  <button type="button" class="btn ghost" id="cancel-edit" hidden>取消編輯</button>
                </div>
              </form>
            </div>
          </details>
        </div>
      </section>
    </main>
  </div>

  <!-- 詳細視窗 -->
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-box" id="detail-box"></div>
  </div>

  <!-- 名字輸入彈窗（取代 prompt；密碼仍走 prompt）-->
  <div id="name-modal" class="modal" hidden>
    <div class="modal-box name-box">
      <h3 id="name-title">歡迎！請輸入你的名字</h3>
      <input type="text" id="name-input" maxlength="20" placeholder="你的名字" autocomplete="nickname" />
      <div class="name-actions">
        <button type="button" class="btn ghost" id="name-cancel" hidden>取消</button>
        <button type="button" class="btn primary" id="name-confirm">確認</button>
      </div>
    </div>
  </div>

  <!-- 提示訊息 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 首次進入彈窗（尋人啟事風格）-->
  <div id="poster-modal" class="poster-modal" hidden>
    <div class="poster">
      <h2 class="poster-title">你有看過<br />這個女生嗎</h2>
      <img class="poster-img" src="assets/img/ashan.jpg" alt="阿珊" />
      <p class="poster-caption">
        她是阿珊，長的超級可愛<br />
        如果你沒看過，現在讓你看看
      </p>
      <button type="button" class="poster-confirm" id="poster-confirm">確認</button>
    </div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
